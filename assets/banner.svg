<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Accent Gradient for Text/Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Dynamic Animations */
    @keyframes pulseCircle {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }

    .pulsing-node {
      transform-origin: center;
      animation: pulseCircle 4s ease-in-out infinite;
    }
    .floating-item-1 { animation: floatParticle 6s ease-in-out infinite; }
    .floating-item-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .floating-item-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashFlow 3s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)"/>
  </g>

  <!-- Background Dynamic Graphical Elements (Kept behind foreground text) -->
  <!-- Audit Connections & Network Mesh -->
  <g stroke="url(#accentGrad)" stroke-width="2" opacity="0.35">
    <path class="flow-line" d="M 800 100 L 950 140 L 1080 90 L 1020 250 L 880 280 Z" fill="none"/>
    <path class="flow-line" d="M 880 280 L 950 140 M 800 100 L 1020 250" fill="none"/>
  </g>

  <!-- Animated Glowing Network Nodes (Right Side Background) -->
  <g filter="url(#softGlow)">
    <circle cx="800" cy="100" r="12" fill="#38bdf8" class="pulsing-node" />
    <circle cx="950" cy="140" r="16" fill="#818cf8" class="pulsing-node" style="animation-delay: 1s;"/>
    <circle cx="1080" cy="90" r="10" fill="#c084fc" class="pulsing-node" style="animation-delay: 2s;"/>
    <circle cx="1020" cy="250" r="14" fill="#38bdf8" class="pulsing-node" style="animation-delay: 0.5s;"/>
    <circle cx="880" cy="280" r="11" fill="#818cf8" class="pulsing-node" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Floating Dynamic Tech Cards (Right Side Decorative) -->
  <g class="floating-item-1" opacity="0.5">
    <rect x="850" y="60" width="90" height="50" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="895" y="90" font-family="sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle">🗳️ E2EV</text>
  </g>
  <g class="floating-item-2" opacity="0.5">
    <rect x="990" y="180" width="110" height="54" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="1045" y="212" font-family="sans-serif" font-size="12" fill="#818cf8" text-anchor="middle">📊 RLA Audit</text>
  </g>
  <g class="floating-item-3" opacity="0.5">
    <rect x="770" y="220" width="100" height="48" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="820" y="250" font-family="sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">🔐 Security</text>
  </g>

  <!-- Foreground Content Block (Left Aligned & High Contrast for Legibility) -->
  <!-- Tag / Pill Badge -->
  <rect x="60" y="55" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <text x="170" y="76" class="badge-text" text-anchor="middle">🗳️ ELECTION TECH CURATION</text>

  <!-- Main Title -->
  <text x="60" y="145" class="title" filter="url(#glow)">Awesome Election</text>
  <text x="60" y="202" class="title" fill="url(#accentGrad)">Management Systems 🗳️</text>

  <!-- Subtitle / Description -->
  <text x="60" y="250" class="subtitle">
    Curated SaaS Platforms &amp; Open-Source Projects for Modern Elections
  </text>
  
  <text x="60" y="280" class="subtitle" font-size="15" fill="#64748b">
    Voter Registration • Electronic Poll Books • Ballot Tabulation • End-to-End Verifiability • RLAs
  </text>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
