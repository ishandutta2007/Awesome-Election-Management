<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseCircle{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.15);opacity:.8}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-15px) rotate(180deg);opacity:.7}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:48px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.pulsing-node{transform-origin:center;animation:pulseCircle 4s ease-in-out infinite}.floating-item-1{animation:floatParticle 6s ease-in-out infinite}.floating-item-2{animation:floatParticle 8s ease-in-out infinite 1s}.floating-item-3{animation:floatParticle 7s ease-in-out infinite 2s}.flow-line{stroke-dasharray:8 12;animation:dashFlow 3s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40"/></pattern><rect width="1200" height="360" fill="url(#grid)"/></g><g stroke="url(#accentGrad)" stroke-width="2" opacity=".35"><path fill="none" d="M 800 100 L 950 140 L 1080 90 L 1020 250 L 880 280 Z" class="flow-line"/><path fill="none" d="M 880 280 L 950 140 M 800 100 L 1020 250" class="flow-line"/></g><g filter="url(#softGlow)"><circle cx="800" cy="100" r="12" fill="#38bdf8" class="pulsing-node"/><circle cx="950" cy="140" r="16" fill="#818cf8" class="pulsing-node" style="animation-delay:1s"/><circle cx="1080" cy="90" r="10" fill="#c084fc" class="pulsing-node" style="animation-delay:2s"/><circle cx="1020" cy="250" r="14" fill="#38bdf8" class="pulsing-node" style="animation-delay:.5s"/><circle cx="880" cy="280" r="11" fill="#818cf8" class="pulsing-node" style="animation-delay:1.5s"/></g><g class="floating-item-1" opacity=".5"><rect width="90" height="50" x="850" y="60" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="8"/><text x="895" y="90" fill="#38bdf8" font-family="sans-serif" font-size="12" text-anchor="middle">🗳️ E2EV</text></g><g class="floating-item-2" opacity=".5"><rect width="110" height="54" x="990" y="180" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="8"/><text x="1045" y="212" fill="#818cf8" font-family="sans-serif" font-size="12" text-anchor="middle">📊 RLA Audit</text></g><g class="floating-item-3" opacity=".5"><rect width="100" height="48" x="770" y="220" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" rx="8"/><text x="820" y="250" fill="#c084fc" font-family="sans-serif" font-size="12" text-anchor="middle">🔐 Security</text></g><rect width="220" height="32" x="60" y="55" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="16"/><text x="170" y="76" class="badge-text" text-anchor="middle">🗳️ ELECTION TECH CURATION</text><text x="60" y="145" class="title" filter="url(#glow)">Awesome Election</text><text x="60" y="202" fill="url(#accentGrad)" class="title">Management Systems 🗳️</text><text x="60" y="250" class="subtitle">Curated SaaS Platforms &amp; Open-Source Projects for Modern Elections</text><text x="60" y="280" fill="#64748b" class="subtitle" font-size="15">Voter Registration • Electronic Poll Books • Ballot Tabulation • End-to-End Verifiability • RLAs</text><rect width="1200" height="4" x="0" y="0" fill="url(#accentGrad)"/></svg>